<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TigerTA Session</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navigation-bar">
        <div class="logo">TigerTA</div>
        <div class="navigation-right">
            <a href="/logout" class="navigation-button" 
            onclick="return confirm('Logging out will end this session. Are you sure you want to continue? This action cannot be undone.');">Log Out</a>
        </div>
    </div>
    <div class="container">
        <h1>You've been matched with a student! </h1>
        <div class="studentinfo-box">
            <strong>Student: </strong> {{ student_name }}
            <strong>Course: </strong> {{ course }}
            <strong>Assignment: </strong> {{ assignment }}
            <strong class = important-info><span id="timer"></span></strong>
        </div>

        <div class="problem-box">
            <strong>Help Topic:</strong>
            <p>{{ bug_description }}</p>
        </div>

        <form method="post" action="{{ url_for('ta_routes.insessionta') }}">
            <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
            <button type="submit" name="action" value="end_session" class="button-link">End Session</button>
        </form>
    </div>
    <script>
        const startTime = new Date("{{ time_session_began }}Z");
        function updateTimer() {
            const now = new Date();
            const diff = Math.floor((now - startTime) / 1000);

            const minutes = String(Math.floor(diff / 60)).padStart(2, '0');
            const seconds = String(diff % 60).padStart(2, '0');

            document.getElementById("timer").innerHTML =
                "Session length: " + minutes + " min " + seconds + " sec";
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
    {% include 'footer.html' %}

    
</body>
</html>
