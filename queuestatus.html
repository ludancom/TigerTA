<!DOCTYPE html>
<html>
<head>
    <title>TigerTA Queue Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container">
        <h1 id="placeText"></h1>

        <p>
            Thanks for joining the queue! We'll email you when you are next in the queue and when it is your turn.
            If you are working with a partner, only one person should join the queue.
        </p>

        <div class="status-box">
        <strong id="numTAs"></strong> 
        </div>

        <div class="problem-box">
            <strong>Help Topic:</strong>
            <p>{{ bug_description }}</p>
        </div>
        
        <form method="post" action="{{ url_for('student_routes.queuestatus') }}">
            <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
            <button type="submit" name="action" value="leave_queue" onclick="return confirm('Are you sure you want to leave the queue? This action cannot be undone.');"
            class="button-link secondary">Leave Queue</button>
        </form> 
    </div>
    {% include 'footer.html' %}

    <script> 
    let place = "{{ student_place }}";
    document.getElementById("placeText").innerText = "You're " + getOrdinal(place) + " in line!";

    let num_on_shift_tas = "{{ num_on_shift_tas }}"
    if(num_on_shift_tas == 1){
        document.getElementById("numTAs").innerText = "1 TA is currently on shift for your course.";
    }
    else{
        document.getElementById("numTAs").innerText = num_on_shift_tas + " TAs are currently on shift for your course.";
    }
    
    function getOrdinal(n) {
        var s=["th","st","nd","rd"],
        v=n%100;
        return n+(s[(v-20)%10]||s[v]||s[0]);
    }

    setInterval (async function(){
        try {
        const response = await fetch('/trymatch');
        const data = await response.json();

        // If student matched, go to session page
        if (data.matched) {
            window.location.href = "/insessionstudent";
            return;
        }

        // If student was matched, but TA ends session (deleting student from database) before student 
        // is redirected to in session page...
        if(!data.in_database){
            window.location.href = "/endsessionstudent";
            return;
        }

        // Otherwise, show their place in line and update it
        if (data.student_place != null) {
            document.getElementById("placeText").innerText =
                "You're " + getOrdinal(data.student_place) + " in line!";
        }

        if(data.num_on_shift_tas == 1){
            document.getElementById("numTAs").innerText = "1 TA is currently on shift for your course.";
        }
        else{
            document.getElementById("numTAs").innerText = data.num_on_shift_tas + " TAs are currently on shift for your course.";
        }
        } catch (error) {
        console.log("error matching or retrieving number:", error);
        }
    }, 10000);

    </script>
        <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");

        if(error === "already_in_queue"){
            alert("You’re already in the queue. To restart your place, please leave and join again.");
        }
    </script>

</body>
</html>
