<!DOCTYPE html>
<html>
<head>
    <title>TigerTA - Remove TA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Please enter the net ID of the TA you would like to remove.</h1>

        <form action="/remove_ta" method="post">
            <h2>TA Net ID</h2>
            <input type="text" id="ta_net_id" name="ta_net_id" placeholder="TA's net ID" required>

            <p>Please ensure this is the correct Net ID before moving forward. This action is not reversible.</p>

            <input type="submit" value="Remove TA">
        </form>
    </div>

    {% include 'footer.html' %}
</body>
</html>
