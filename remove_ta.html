<!DOCTYPE html>
<html>
<head>
    <title>TigerTA - Remove TA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navigation-bar">
        <div class="logo">TigerTA</div>
        <div class="navigation-right">
            <a href="/roleselection" class="navigation-button">Switch Role</a>
            <a href="/logout" class="navigation-button">Log Out</a>
        </div>
    </div>
    <div class="container">
        <h1>Remove TA</h1>

        <form action="/remove_ta" method="post">
            <h2>Net ID</h2>
            <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
            <input type="text" id="ta_net_id" name="ta_net_id" placeholder="Enter the TA's netID" required maxlength="8">
            <input type="submit" value="Remove TA" class="button-link" onclick="return confirm('Please confirm this is the netID of the TA you want to delete before continuing. This action cannot be undone.')";>
            <a href="{{ url_for('admin_routes.adminpage') }}" class="button-link">Back</a>
        </form>
    </div>

    {% include 'footer.html' %}
</body>
</html>
