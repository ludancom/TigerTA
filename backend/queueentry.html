<!DOCTYPE html>
<html>
<div class="container">
<head>
    <title>TigerTA Queue</title>
    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class=header><h1>To join the queue, please enter the following:</h1></div>

    <form action="/queueentry" method="get" onsubmit="return validateForm()">

        <h2>Select your course</h2>
        <div class="form-button">
        <label>
            <input type="radio" name="course" value="COS 126" onclick="updateAssignments()" required>
            COS 126
        </label>
        </div>
        <div class="form-button">
        <label>
            <input type="radio" name="course" value="COS 226" onclick="updateAssignments()">
            COS 226
        </label>
        </div>
        <div class="form-button">
        <label>
            <input type="radio" name="course" value="COS 217" onclick="updateAssignments()">
            COS 217
        </label>
        </div>

        <h2>Select your assignment</h2>
        <select id="assignments" name="assignment"></select>

        <h2>Describe your problem</h2>
        <textarea id="bug_description" name="bug_description" rows="5" cols="50" required></textarea>

        <br>
        <br>
        <input type="submit" value="Join Queue">
    </form>

    <script>
        function updateAssignments() {
            let course = document.querySelector(
                'input[name="course"]:checked').value;
            let dropdown = document.getElementById("assignments");

            dropdown.innerHTML = "";

            let options = [];

            if (course === "COS 126") {
                options = [
                    ["a0", "0. Hello, World"],
                    ["a1", "1. Conditionals and Loops"],
                    ["a2", "2. Arrays and Input/Output"],
                    ["a3", "3. Conjunction Function"],
                    ["a4", "4. Recursion"],
                    ["a5", "5. Object Oriented Programming"],
                    ["a6", "6. Guitar Hero"],
                    ["a7", "7. Image Classifier"],
                    ["a8", "8. Chat126"],
                    ["a9", "9. Hamming Codes in TOY"]
                ];
            }
            else if (course === "COS 226") {
                options = [
                    ["a1", "1. Percolation"],
                    ["a2", "2. Queues"],
                    ["a3", "3. Autocomplete"],
                    ["a4", "4. K-d Trees"],
                    ["a5", "5. WordNet"],
                    ["a6", "6. Seam Carving"],
                    ["a7", "7. Fraud Detection"]

                ];
            }
            else if (course === "COS 217") {
                options = [
                    ["a0", "0. Introductory Survey"],
                    ["a1", '1. A "De-Comment" Program'],
                    ["a2", "2. A String Module and Client"],
                    ["a3", "3. A Symbol Table Module"],
                    ["a4", "4. Directory and File Trees"],
                    ["a5", "5. Assembly Language Programming and Testing"],
                    ["a6", "6. A Buffer Overrun Attack"]
                ];
            }

            for (let i = 0; i < options.length; i++) {
                let option = document.createElement("option");
                option.value = options[i][0];
                option.text = options[i][1];
                dropdown.appendChild(option);
            }
        }
    </script>

    <script>
        function validateForm() {
            let course = document.querySelector('input[name="course"]:checked');
            let bugDescription = document.getElementById("bug_description").value.trim();

        if (!course || bugDescription === "") {
            alert("Please select a course and/or describe your problem before submitting.");
            return false;
        }

        return true;
    }
</script>

    {% include 'footer.html' %}
</body>
</div>

</html>
