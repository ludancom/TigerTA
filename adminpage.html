<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>View TAs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    {% include 'navbar.html' %}
    <div class="container">
        <h1>TA Management</h1>

        <div class="table-wrap">
            <table class="student-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>NetID</th>
                        <th>Email</th> <!-- still need to add email -->
                        <th>Courses</th> <!-- do i need to change how this is displayed?-->
                        <!-- because we're getting from the courses tables?-->
                        <th>Edit</th>
                    </tr>
                </thead>

                <tbody>
                    {% for ta in tas %}
                        <tr>
                            <td>{{ ta["ta_name"] }}</td>
                            <td>{{ ta["ta_netid"] }}</td>
                            <td>{{ ta["ta_email"] }}</td>
                            <td>{{ ta["courses"] }}</td>
                            <td>
                                <button 
                                    type="button"
                                    class="button-link edit-ta-btn"
                                    data-netid="{{ ta['ta_netid'] }}"
                                    data-name="{{ ta['ta_name'] }}"
                                    data-email="{{ ta['ta_email'] }}"
                                    data-courses="{{ ta['courses'] }}">
                                    Edit
                                </button>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <hr>

        <a href="{{ url_for('admin_routes.add_ta') }}" class="button-link">Add TA</a>
        <a href="{{ url_for('admin_routes.remove_ta') }}" class="button-link">Remove TA</a>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Edit TA</h2>
            <!-- Triggers this modal when the button is clicked-->
            <form method="post" action="{{ url_for('admin_routes.edit_ta') }}">
                <!-- CSRF token to protect against attacks -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="edit_name">Name</label>
                <input type="text" id="edit_name" name="ta_name" required>

                <label for="edit_netid">NetID</label>
                <input type="text" id="edit_netid" name="ta_netid" readonly>

                <label for="edit_email">Email</label>
                <input type="email" id="edit_email" name="email" readonly>

                <h2>Course</h2>
                <div class="course-options">
                    <label>
                        <input type="radio" name="course" value="COS 126" required>
                        COS 126
                    </label>
                    <label>
                        <input type="radio" name="course" value="COS 2XX">
                        COS 2XX
                    </label>
                </div>

                <button type="submit" class="button-link primary">Save Changes</button>
                <button type="button" class="button-link" id="cancelModal">Back</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById("editModal");
        const closeModal = document.getElementById("closeModal");
        const cancelModal = document.getElementById("cancelModal");
        const editButtons = document.querySelectorAll(".edit-ta-btn");

        const editName = document.getElementById("edit_name");
        const editNetid = document.getElementById("edit_netid");
        const editEmail = document.getElementById("edit_email");
        const editCourses = document.getElementById("edit_courses");

        editButtons.forEach(button => {
            button.addEventListener("click", () => {
                const netid = button.getAttribute("data-netid");
                const name = button.getAttribute("data-name");
                const email = button.getAttribute("data-email");
                const courses = button.getAttribute("data-courses");

                editName.value = name;
                editNetid.value = netid;
                editEmail.value = email;
                editCourses.value = courses;

                modal.style.display = "block";
            });
        });

        closeModal.addEventListener("click", () => {
            modal.style.display = "none";
        });

        cancelModal.addEventListener("click", () => {
            modal.style.display = "none";
        });

        window.addEventListener("click", (event) => {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        });

    </script>
    {% include 'footer.html' %}
</body>
</html>
