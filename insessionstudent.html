<!DOCTYPE html>
<html>
<head>
    <title>TigerTA Session</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>You've been matched with a TA! </h1>
        <p> Your TA, <span class="name"> {{ ta_name }}</span>, will come to you. </p>

        <div class="problem-box">
            <strong>Help Topic:</strong>
            <p>{{ bug_description }}</p>
        </div>
    </div>
    {% include 'footer.html' %}
    
    <script>
    setInterval(async function () {
        try {
            const response = await fetch('/trymatch');
            const data = await response.json();

            // if no longer matched then send to end session page
            if (!data.matched) {
                // setting the cookie for the ta name
                const taName = "{{ ta_name }}";

                // saving it here so it doesnt get lost
                document.cookie = "ta_name=" + taName + "; path=/";

                //send to end session page
                window.location.href = "/endsessionstudent";
            }

        } catch (err) {
        console.log("Polling error:", err);
        }
    }, 3000);
    </script>

    </script>

        <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");

        if(error === "already_in_session"){
            alert("You’re currently being helped by a TA. You can rejoin the queue once your TA ends your session.");
        }
    </script>
</body>
</html>
