<!DOCTYPE html>
<html>
<head>
    <title>TigerTA Queue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>To join the queue, please enter the following:</h1>

        <form action="/queueentry" method="post" onsubmit="return validateForm()">
            <h2>Enter your name</h2>
            <input type="text" id="student_name" name="student_name" placeholder="Your name" required>

            <h2>Select your course</h2>
            <div class="course-options">
                <label>
                    <input type="radio" name="course" value="COS 126" onclick="updateAssignments()" required>
                    COS 126
                </label>

                <label>
                    <input type="radio" name="course" value="COS 226" onclick="updateAssignments()">
                    COS 226
                </label>

                <label>
                    <input type="radio" name="course" value="COS 217" onclick="updateAssignments()">
                    COS 217
                </label>
            </div>

            <h2>Select your assignment</h2>
            <select id="assignments" name="assignment" required>
                <option value="">Choose an assignment</option>
            </select>

            <h2>Describe your problem</h2>
            <textarea id="bug_description" name="bug_description" required></textarea>

            <input type="submit" value="Join Queue">
        </form>
    </div>

    <script>
        function updateAssignments() {
            let selectedCourse = document.querySelector('input[name="course"]:checked');
            let dropdown = document.getElementById("assignments");

            dropdown.innerHTML = '<option value="">Choose an assignment</option>';

            if (!selectedCourse) return;

            let course = selectedCourse.value;
            let options = [];

            if (course === "COS 126") {
                options = [
                    ["a0", "0. Hello, World"],
                    ["a1", "1. Conditionals and Loops"],
                    ["a2", "2. Arrays and Input/Output"],
                    ["a3", "3. Conjunction Function"],
                    ["a4", "4. Recursion"],
                    ["a5", "5. Object Oriented Programming"],
                    ["a6", "6. Guitar Hero"],
                    ["a7", "7. Image Classifier"],
                    ["a8", "8. Chat126"],
                    ["a9", "9. Hamming Codes in TOY"]
                ];
            } else if (course === "COS 226") {
                options = [
                    ["a1", "1. Percolation"],
                    ["a2", "2. Queues"],
                    ["a3", "3. Autocomplete"],
                    ["a4", "4. K-d Trees"],
                    ["a5", "5. WordNet"],
                    ["a6", "6. Seam Carving"],
                    ["a7", "7. Fraud Detection"]
                ];
            } else if (course === "COS 217") {
                options = [
                    ["a0", "0. Introductory Survey"],
                    ["a1", "1. A De-Comment Program"],
                    ["a2", "2. A String Module and Client"],
                    ["a3", "3. A Symbol Table Module"],
                    ["a4", "4. Directory and File Trees"],
                    ["a5", "5. Assembly Language Programming and Testing"],
                    ["a6", "6. A Buffer Overrun Attack"]
                ];
            }

            for (let i = 0; i < options.length; i++) {
                let option = document.createElement("option");
                option.value = options[i][0];
                option.text = options[i][1];
                dropdown.appendChild(option);
            }
        }

        function validateForm() {
            let course = document.querySelector('input[name="course"]:checked');
            let studentName = document.getElementById("student_name").value.trim();
            let assignment = document.getElementById("assignments").value;
            let bugDescription = document.getElementById("bug_description").value.trim();

            if (!studentName || !course || !assignment || !bugDescription) {
                alert("Please fill out all fields before submitting.");
                return false;
            }
            return true;
        }
    </script>
    {% include 'footer.html' %}
</body>
</html>
