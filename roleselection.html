<!DOCTYPE html>
<html>
<head>
    <title>TigerTA Role</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Please select your role.</h1>
         <form method="post" action="{{ url_for('student_routes.roleselection') }}">
            <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
            <button type="submit" name="role" value="TA" class="button-link">TA</button>
            <button type="submit" name="role" value="Student" class="button-link">Student</button>
            <button type="submit" name="role" value="Admin" class="button-link">Admin</button>
        </form>
    </div>
    {% include 'footer.html' %}
    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");

        if(error === "not_ta"){
            alert("You are not authorized as a TA. Please select the correct option.");
        }

        if(error === "not_admin"){
            alert("You are not authorized as an Admin. Please select the correct option.");
        }

    </script>
</body>
</html>
