<!DOCTYPE html>
<html>
<head>
    <title>TigerTA - Add TA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navigation-bar">
        <div class="logo">TigerTA</div>
        <div class="navigation-right">
            <a href="/roleselection" class="navigation-button">Switch Role</a>
            <a href="/logout" class="navigation-button">Log Out</a>
        </div>
    </div>
    <div class="container">
        <h1>Add New TA</h1>
        <form action="/add_ta" method="post">
            <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
            <h2>Full Name</h2>
            <input type="text" id="ta_name" name="ta_name" placeholder="Enter the TA's first and last name" required  maxlength="50">

            <h2>NetID</h2>
            <input type="text" id="ta_net_id" name="ta_net_id" placeholder="Enter the TA's netID" required  maxlength="8">

            <h2>Email</h2>
            <input type="email" id="email" name="email" placeholder="Enter the TA's email" required maxlength="100">

            <h2>Course</h2>
            <div class="course-options">
                <label>
                    <input type="radio" name="course" value="COS 126" required>
                    COS 126
                </label>
                <label>
                    <input type="radio" name="course" value="COS 2XX">
                    COS 2XX
                </label>
            </div>

            <input type="submit" value="Add TA" class="button-link">
        </form>
    </div>

    {% include 'footer.html' %}
</body>
</html>
